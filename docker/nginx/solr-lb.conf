# nginx in front of the two Solr nodes (compose.solrcloud.yaml): the other parts reach Solr as http://solr:8983/solr.
# A node that does not answer is skipped for a while; a request it failed on goes to the other one.
resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's DNS: a node that was made again has a new address
upstream solr_nodes {
    zone solr_nodes 64k;
    server solr1:8983 resolve max_fails=1 fail_timeout=10s;
    server solr2:8983 resolve max_fails=1 fail_timeout=10s;
}
server {
    listen 8983;
    location / {
        proxy_pass http://solr_nodes;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        client_max_body_size 50m;   # batches of documents from the crawler
    }
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
