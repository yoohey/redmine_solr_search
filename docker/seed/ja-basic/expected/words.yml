# Search words for the ja-basic dataset: the input of seed/expect.sh, which computes expected.yml and summary.md.
# Add a word here and re-run seed/expect.sh ja-basic. Keep `purpose` short: it is copied into summary.md.
#   word     what to search for
#   purpose  what this word checks (why it is here)

# Permissions: must never leak
- word: 社外秘
  purpose: プライベートチケットだけに入る語。権限のないユーザーに出たら漏れ
- word: 翠嶺台
  purpose: 社外秘の添付ファイル（docx）だけにある架空の駅。プライベートチケットの添付からだけヒットする

# Attachments: one line per file, formats differ (answer key: attachments/lines.yml)
- word: 東京
  purpose: 複数の路線（山手線・中央線快速・京浜東北線・京葉線）にある駅。複数のファイルにヒットする
- word: 新宿
  purpose: 複数の路線にある駅（山手線・中央線快速・総武線各停・埼京線のうち、本文が取れるものだけ）
- word: 海芝浦
  purpose: 鶴見線（txt）にだけある駅
- word: 茅ケ崎
  purpose: 相模線（Shift_JISのtxt）にだけある駅。文字コードの判定ができているか
- word: 登戸
  purpose: 南武線（zipの中のtxtとcsv）にだけある駅。アーカイブの中まで読めているか
- word: 戸田公園
  purpose: 埼京線（スキャン風PDF、本文なし）にだけある駅。本文からは0件が正しい
- word: 大宮
  purpose: 埼京線（本文なし）と京浜東北線（html）にある駅。htmlだけにヒットする
- word: 拝島
  purpose: 青梅線（png、本文なし）と五日市線（pptx）にある駅。pptxだけにヒットする
- word: 大阪環状線
  purpose: 路線名。xlsxの本文とファイル名にある

# Redmine text (issues, notes, wiki, documents)
- word: Solr
  purpose: 英字（大文字あり）。search-platformの語
- word: solr
  purpose: 英字（小文字）。大文字小文字を区別しないなら「Solr」と同じ結果
- word: Kuromoji
  purpose: 英字の固有名
- word: インデックス
  purpose: カタカナ語。search-platformで頻出
- word: 形態素解析
  purpose: 複合語。形態素解析では「形態素」と「解析」に分かれる
- word: 議事録
  purpose: 形態素解析で「議事」と「録」に分かれる語（Kuromoji）。件名の【議事録】とdept-docsの語
- word: 棚卸し
  purpose: 送り仮名つきの語。dept-docsの語と計画タスク
- word: 健康診断
  purpose: 公開プロジェクトgeneralだけの語。所属のないユーザーや未ログインでも見える
