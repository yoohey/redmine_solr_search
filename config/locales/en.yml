  label_solr_search_reranker_chars: "Length sent for each (characters)"
  text_solr_search_reranker_chars: "%{min} to %{max}. The title and the snippet, up to this length."
  label_solr_search_reranker_timeout: "Time to wait (seconds)"
  text_solr_search_reranker_timeout: "%{min} to %{max}. After it, the answer has the order it has now."
  text_solr_search_reranker_key_set: "API key: the environment variable %{name} is set (sent as Authorization: Bearer; never shown here)."
  text_solr_search_reranker_key_none: "API key: the environment variable %{name} is not set (fine for a service that wants no key). The key is not saved here."
