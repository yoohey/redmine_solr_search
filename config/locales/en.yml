  label_solr_search_admin_tab_log: "Search log"
  text_solr_search_log: "It holds the users and what they searched for. What was opened from the result screen (the clicks) is recorded too. From the words with no result, the ones that found something but had nothing opened, and the ones searched most, find the synonym list (solr/common/synonyms-ja.txt) and what is missing from the index. The numbers are of the searches of the first page only (page 2 and on are the same search going on). A search left without opening anything is a sign that it did not help; but what was opened with a right click and the like is not counted, so it is a guide. \"Open the same search\" adds a row to this log each time."
  text_solr_search_log_summary: "The record of the searches of the search screen. Only administrators see it. It is not deleted by itself."
