  label_solr_search_log_export: "Download"
  text_solr_search_log_export: "Downloads every search and click that fits the conditions now (the period, no result only, nothing opened only, the words) as a zip (three CSV files and a README). The list shows 50 at a time; the download is all of it. The CSV files are UTF-8 with a byte order mark, so Excel and Power Query read them. The three are the search log, the clicks, and how the collections were when the file was made (the name of the collection, the configset, the counts of each type, the external sources ...). They hold users and what they searched for: handle them with care."
