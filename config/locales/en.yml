  text_solr_search_reindex_summary: "Sends every record of the chosen types to Solr again. It does not remove anything. The scheduler starts it within a minute."
  text_solr_search_reindex: "This only sets the flag to run again. The scheduler does the work, starting within a minute (without the scheduler: rake redmine:solr_search:requests). Only one run goes at a time, so it waits while another run is going on. It only sends the records again and removes nothing that Redmine no longer has (the reconciliation does that). Attachments are sent by their own crawl as a rule (what the index lacks). To make the text of every one again, use \"Attachments reindex\" below (heavy, so it is a section of its own). The table lists the ones that wait or run and the newest 3 that finished, with their state (they are run records, so those past the retention period are gone). Only a waiting one can be cancelled. The counts are in the runs below, started by \"Admin page\"."
