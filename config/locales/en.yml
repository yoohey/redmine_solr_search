  label_solr_search_project_sources_none_allowed: "No external sources are available. Ask an administrator to allow some if you need them."
  text_solr_search_project_sources_hint: "Choose, among the external sources the administrators allowed for this project, those to search. Only people whose role has \"Search external documents\" can search the documents of the sources chosen. Sources in an invalid state cannot be newly chosen."
  error_solr_search_source_not_allowed: "Includes external sources that are not allowed for this project."
  error_solr_search_source_invalid: "Cannot link external sources in an invalid state."
  field_link_format: "Display format"
  field_link_pattern: "Link pattern"
  label_solr_search_link_format_text: "As text (shows where the document is)"
  label_solr_search_link_format_link: "As a link (made from the pattern)"
  text_solr_search_link_pattern: "Used for \"As a link\". Example: https://intranet.example/files/%path%  %url%, %path%, %title% and %id% are replaced with the document's values (URL-encoded; a / becomes %2F). %path_slash% is the location with \\ turned into / and each part URL-encoded, the / kept (\\\\server\\share\\a.pdf gives server/share/a.pdf). It must start with http:// or https:// and name the host, which cannot use a replacement. A browser does not open file:// links from a web page: to show where a file in a shared folder is, write a pattern that maps it to a URL the web can open."
  label_solr_search_link_example_pattern: "Format example: open the documents of a shared folder in the intranet's viewer"
  text_solr_search_link_example_pattern: "Write this in \"Link format\". A document whose place is \\\\server\\share\\a.pdf gets the link https://docs.example.com/files/server/share/a.pdf."
  label_solr_search_link_example_script: "Script example: add a \"Copy path\" button to the results"
  text_solr_search_link_example_script: "Put it in a View Customize \"JavaScript\" rule (path pattern /solr_search$, insertion position \"bottom of the page\"). The button copies the place, to paste it into the file explorer. It runs when the page is loaded and on solr-search:updated, after the result is put in place again by the left bar or the page links."
  button_solr_search_code_copy: "Copy"
  text_solr_search_link_attributes: "In either format, the element of an external document in the results carries data-solr-source, data-solr-source-name, data-solr-id, data-solr-title, data-solr-url, data-solr-path and data-solr-indexed-path (the location as it is in the index). A script (View Customize, for example) can make any link from them. The values are set by the author of the document: do not trust them, and check that a link starts with http:// or https:// before using it (so that javascript: and the like never reach an href)."
  error_solr_search_link_pattern: "must start with http:// or https:// and name the host (the host cannot use %url% and the like)"
