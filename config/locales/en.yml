  label_solr_search_reranker: "Reranker (optional)"
  text_solr_search_reranker: "Sends the query and the titles and snippets of the first results to an external service, and puts those results in the order of the scores that come back. With no address it is not used (nothing changes). It works only by relevance, and only for a page that lies in the range that is put in order. If the service is down, the search answers in the order it has now. The query and the text of the results are sent to that service. Check that it runs inside your organization."
  label_solr_search_reranker_url: "Address"
  text_solr_search_reranker_url: "For TEI, \"http://…:8080\" (no need to add /rerank); for a Cohere-compatible service, the whole address that is called. Empty: not used."
