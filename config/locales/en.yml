  text_solr_search_sources_archived: "In \"Projects that search it\", a name without a link is an archived project (Redmine's own behaviour)."
  text_solr_search_sources: "An external source is the documents of one Solr collection. Make the collection in Solr (Redmine does not), then choose it in \"Collections not registered yet\" below and register it with a name and a description. Only collections made from the configset src can be chosen. For each source, decide the projects allowed to use it; in the \"Full-text search\" tab of its settings, each project chooses whether to search it. The marks show how Solr was when this page was opened; they do not change what is searched."
  text_solr_search_source_description: "Where the documents come from (a folder ...), to help those who link it."
  text_solr_search_source_linkable: "The administrators of the projects allowed here choose, in the \"Full-text search\" tab of the project settings, whether the project searches this source. Subprojects of a chosen project are not included. Taking the permission back also takes the source out of that project's searches."
  text_solr_search_source_linked: "Links are changed on the \"Full-text search\" tab of each project's settings."
  text_solr_search_source_delete_confirm: "Deletes the external source \"%{name}\": it stops being searched. The Solr collection and its documents stay. Continue?"
  warning_solr_search_source_missing: "There is no collection %{collection} in Solr: its documents do not come out."
  warning_solr_search_source_wrong_configset: "The collection %{collection} is not made from the configset src (%{configset}). Searches may fail once the source is linked."
  warning_solr_search_source_unknown: "The Solr collection could not be checked: %{error}"
  label_solr_search_changes_of_source: "Only the changes of the external source \"%{name}\"."
