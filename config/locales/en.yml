  text_solr_search_tuning_preview: "Enter words and press \"Trial search\": the order now and the order with the values of the form are shown side by side. Nothing is saved. It searches all projects and external sources, as an administrator. Only the weights of Solr are compared: the external reranker (the fields below) is not used, so changing its settings does not change this result."
