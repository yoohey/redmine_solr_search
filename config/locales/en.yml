  label_solr_search_admin_page: "Administration > Full-text search"
  text_solr_search_settings_status_html: "Whether Solr answers, the index counts and the crawl runs are shown on %{link}."
  text_solr_search_admin_counts: "Redmine: what the index should hold. A difference is expected until the next crawl. The Solr total should equal the \"Documents\" of each replica below."
  text_solr_search_admin_custom_fields: "Issue custom field values are indexed for the fields each issue has. Changing a field's trackers, projects, format or 'used as a filter', or deleting a field, does not change the issues' update time, so the incremental crawl does not pick it up: use \"Partial reindex\" on the Index tab and choose the field or the tracker (rake redmine:solr_search:reindex FIELDS=ID; for all issues and notes, TYPES=issue,journal; the attachments catch up with the regular resend). Changes to visibility, roles and searchable apply at once."
  label_solr_search_admin_replicas: "Replicas"
  label_solr_search_admin_replicas_error: "Cannot read the replicas (CLUSTERSTATUS)"
  label_solr_search_admin_core: "Core"
  label_solr_search_admin_node: "Node"
  label_solr_search_admin_leader: "Leader"
  label_solr_search_admin_documents: "Documents"
  label_solr_search_admin_newest: "Newest document updated"
  label_solr_search_admin_last_runs: "Last run of each task"
  text_solr_search_admin_last_runs: "One task runs at a time. For what this table cannot tell (where a failure happened, a task that hangs), see Redmine's log (lines with \"[solr_search]\"): docker compose logs in Docker (the scheduler service; the output of docker compose exec for rake run that way), otherwise log/production.log or the output of the cron job."
  label_solr_search_run_finished_at: "Finished"
  label_solr_search_run_next: "Next run (about)"
  label_solr_search_run_next_due: "soon (past its time)"
  label_solr_search_run_next_disabled: "not run by the scheduler"
  label_solr_search_run_next_manual: "by hand with rake"
