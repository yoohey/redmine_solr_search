  label_solr_search_admin_tab_tuning: "Fine tuning"
  label_solr_search_admin_tab_synonyms: "Synonyms"
  text_solr_search_synonyms_intro: "A dictionary that widens a word of a search to the other ways of saying the same: the old and the new name, a short form and the full name, the words of a department. With it, a search by any of them finds the documents written with any of them. A saved dictionary works at once, on the data of Redmine and on all external sources (no index has to be made again). It is not used when \"search exactly as typed\" is chosen on the search page."
  label_solr_search_synonyms_text: "Dictionary"
  text_solr_search_synonyms_format: "One group per line: the words that mean the same, separated by \",\" (the full-width \"，\" and \"、\" too). A line that starts with \"#\" and a blank line are skipped. A word may hold spaces (for example: single sign on). A word applies only when it is the same as a word of the search as a whole (\"PC\" does not apply to \"PC管理\"). Upper and lower case, full-width and half-width are not told apart. A group has at most 8 words, a word at most 100 characters and 4 words separated by spaces, and the whole at most 2,000 lines and 200 KB."
  text_solr_search_synonyms_example: "# the old and the new name\n在宅勤務,テレワーク,リモートワーク\n# a short form and the full name (a word with a space)\nSSO,single sign on\n# two spellings\n規程,規定"
  label_solr_search_synonyms_example: "Example"
  label_solr_search_synonyms_log: "From the search log"
  text_solr_search_synonyms_log: "The words of the searches of the last %{days} days that did not help (most often first). A word fills the trial search box below. Use them as clues for what to write in the dictionary."
