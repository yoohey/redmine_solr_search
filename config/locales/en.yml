  label_solr_search_run_trigger_admin: "Admin page"
  text_solr_search_admin_replicas: "For each replica, what a search on that replica alone sees: the number of documents and the newest document's update time. Every replica should show the same. \"behind\": its newest document is older than another replica's (it can be active in ZooKeeper and still miss new documents: a stopped leader ...). \"count differs\": the newest document is the same but the counts are not; which is right cannot be told here (a replica that missed deletions has more documents). \"no response\": it did not answer. Right after an update, a mark can show until the commit (within 10 seconds)."
  label_solr_search_admin_title: "Full-text search status"
  text_solr_search_admin_no_solr_url: "Where Solr is has not been set. Set it in Administration > Full-text search > the status tab (type it in the Solr box and press Update), or set the environment variable SOLR_URL (for example http://127.0.0.1:8983/solr) for Redmine (and the scheduler) and restart them."
  label_solr_search_admin_more: "More"
  text_solr_search_admin_custom_fields_summary: "After changing a custom field's settings, a partial reindex (Index tab) may be needed."
  text_solr_search_admin_replicas_summary: "Every replica should show the same. Rows that differ are marked \"behind\", \"count differs\" or \"no response\"."
  text_solr_search_admin_last_runs_summary: "Whether the crawl tasks (rake tasks) ran, whether the scheduler or something else (cron ...) started them."
  text_solr_search_admin_scheduler_silent_summary: "The scheduler is not running or has stopped."
  label_solr_search_admin_scheduler_unused: "The scheduler is not used (every task under \"Crawl\" is off in the settings)."
  label_solr_search_duration_seconds: "%{s} s"
  label_solr_search_duration_minutes: "%{m} min %{s} s"
  label_solr_search_duration_hours: "%{h} h %{m} min"
  label_solr_search_settings_search: "Search screen"
  label_solr_search_settings_admin: "Admin page"
  label_solr_search_schedule_before: "run every"
  label_solr_search_schedule_after: ""
  label_solr_search_schedule_unit: "Unit"
  text_solr_search_run_task_incremental: "Sends the issues, notes, wiki pages and documents updated or created since the last run. How soon new content can be found depends mostly on this interval."
  text_solr_search_run_task_resend: "Sends every document and wiki page again, for changes that leave no update time (a document edited, a wiki page renamed or moved). The more data, the heavier."
  text_solr_search_run_task_attachments: "Sends the attachments of Redmine that the index does not have yet. The text of the files is made by Tika, which is slow, so it has a crawl of its own. A run takes only so many (and so long); the next one goes on. When Tika cannot be reached, the run does nothing and is recorded as failed (where Tika is not used, turn this task off); when Tika is up but does not answer for a file, that file goes in without text. Archives and files too big go in without text (by file name and description only). Each file whose text could not be made for another reason is written to Redmine's log ([solr_search], with the attachment's id)."
  text_solr_search_run_task_reconcile: "Removes from the index what was deleted in Redmine (or no longer belongs in the index). Until then, deleted things are still counted in the search results (they are not shown)."
