  text_solr_search_intro: "Searches issues (with their notes), wiki pages and documents, and the text of their attached files. In projects that use external sources (shared folders and the like), their documents too. Separate words with spaces."
  text_solr_search_none: "Nothing matched \"%{words}\"."
  text_solr_search_none_hints: "Widening the search may find something:"
  text_solr_search_hint_any_words: "Choose \"Any of the words\" (\"All the words\" finds only places that have every word: an issue's subject and description, one note ...)"
  text_solr_search_hint_exact: "Untick \"Exact string\" (inflections and spelling variants are found too)"
  text_solr_search_hint_types: "Tick more types"
  text_solr_search_hint_projects: "Choose \"All projects\""
  text_solr_search_hint_attributes: "Tick \"Include attributes\" (issue custom fields are searched too)"
  error_solr_search_failed: "The search failed. Please try again later or contact the administrator."
  error_solr_search_no_words: "Enter one or more words to search for."
  error_solr_search_too_many_words: "Too many search words. Use at most %{max}."
  setting_solr_search_global_search_access: "Global search access"
  label_solr_search_global_search_access_all: "All users (visitors who are not logged in included)"
  label_solr_search_global_search_access_logged: "Logged-in users only"
  label_solr_search_global_search_access_with_permission: "Users with a \"Full-text search\" permission in any project (administrators included)"
  text_solr_search_global_search_access: "Decides who can use the search from outside a project: \"Full-text search\" in the top menu and in the application menu (the tabs of the pages outside any project). For those who cannot, these two menus are not shown and opening the URL directly does not work either (a visitor who is not logged in is taken to the login page).\n\n\"Full-text search\" in the project menu (the tabs of the pages inside a project) is not affected by this setting: it works where the module is on and the user has the \"Full-text search\" permission.\n\nWhichever is chosen, a search shows only what the user may see in Redmine."
  setting_solr_search_max_words: "Most search words"
  text_solr_search_max_words: "Enter a number from %{min} to %{max} (a value outside is taken as the nearest end, one that is no number as the default). A search with more words asks for fewer and does not query Solr. The more words, the heavier a search is for Solr."
  setting_solr_search_expand_spelling_variants: "Also search other spellings (ヴ/バ rows, ヶ/ケ and the like)"
  text_solr_search_expand_spelling_variants: "A word is also searched in its other spellings (バイオリン and ヴァイオリン, 霞ケ関 and 霞ヶ関). Turn it off to rely on the synonym list in Solr instead. It is a feature apart from the dictionary of the \"Synonyms\" tab, and the two work together when both are on. Neither is applied to \"Exact string\" searches."
  setting_solr_search_show_solr_request: "Show the Solr request to administrators"
  text_solr_search_show_solr_request: "Under the results, administrators see the request sent to Solr and how Solr parsed it."
  setting_solr_search_run_retention_days: "Keep crawl run records for"
  text_solr_search_run_retention_days: "Older records are removed when a crawl finishes. 0 keeps them for ever, which is not recommended: they keep growing (144 a day with an incremental crawl every 10 minutes)."
  label_solr_search_schedule: "Crawl"
  label_solr_search_schedule_every: "every"
  label_solr_search_unit_minutes: "minutes"
  label_solr_search_unit_hours: "hours"
  label_solr_search_unit_days: "days"
  label_solr_search_schedule_none: "Do not use the scheduler"
  text_solr_search_schedule_none: "Turn on when cron or the like runs the rake tasks. All four tasks below are disabled (turning it off enables them all again)."
  text_solr_search_schedule: "The scheduler (rake redmine:solr_search:scheduler; the scheduler service in Docker) runs a task once this long has passed since its last start (a failed run counts). To run tasks at set times (every hour on the hour ...), or without a long-running process, turn them off here and start the rake tasks from cron or the like. The full reindex is never run by the scheduler."
  label_solr_search_settings_attachments: "Attachments"
  setting_solr_search_attachment_extensions: "Extensions whose text is made"
  text_solr_search_attachment_extensions: "Only the files with the extensions written here have their text made by Tika and searched. The others (and files with no extension) are found by file name and description only. Separate them with spaces or commas (case does not matter; the leading . may be there or not). Empty means the default. Images are not in the default: they have no text."
  text_solr_search_attachment_extensions_default: "Default: %{list}"
  text_solr_search_attachment_extensions_in_use: "In use now: %{list}"
  text_solr_search_attachment_extensions_ignored: "Left out as not written like an extension: %{list} (only letters, digits, _ + - are allowed)"
  text_solr_search_attachment_extensions_archive_warning: "Archives (%{list}) are in the list. Everything inside an archive is joined into one huge document, there is no telling which file matched, and whatever is inside goes into the index without anyone knowing. It also takes Tika's time and memory. Use it knowing that."
  setting_solr_search_attachment_max_file_mb: "Largest file whose text is made"
  text_solr_search_attachment_max_file_mb: "A larger file is not sent to Tika: it has its file name and description only (%{min} to %{max})."
  setting_solr_search_attachment_max_text_mb: "Longest text kept"
  text_solr_search_attachment_max_text_mb: "A text longer than this is cut here (%{min} to %{max})."
  label_solr_search_megabytes: "MB"
  text_solr_search_attachment_settings_note: "A change does not touch what is in the index already (new attachments use it at once). To make it clean, ask for the attachments' reindex on the admin page, explicitly."
  text_solr_search_attachment_extensions_admin: "Extensions whose text is made: %{list}. The others have file name and description only."
  setting_solr_search_per_page: "Containers on a page of the search results"
  text_solr_search_per_page: "Enter a number from %{min} to %{max} (a number outside the range is taken as the nearest end; a value that is not a number, as the default, 50). The more, the fewer empty or short pages, but the display and the permission check before it grow with the number (Solr's time does not change). One can always reach %{reach} containers at most. With an external reranker, the number it puts in order is rounded up to a whole page."
  setting_solr_search_search_timeout: "Wait for Solr on the search screen"
  text_solr_search_search_timeout: "After this, the screen says the search failed. Make it longer for a very large index that is worth waiting for."
  setting_solr_search_admin_timeout: "Wait for Solr on the admin page"
  text_solr_search_admin_timeout: "After this, the page says Solr cannot be reached. Kept short so that the page still opens when Solr stops answering."
