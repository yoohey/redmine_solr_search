  text_solr_search_tuning_intro: "A page for tuning the order of the results, for those who know what they are doing; the settings are fine as they are. The values are weights that the search sends to Solr with the words: what is found does not change, only the order, and no reindex is needed. A saved value works for every search at once: compare the order now and the one with your values in the trial search before saving."
  label_solr_search_tuning_fields: "Weights of the fields"
  text_solr_search_tuning_fields: "How many points a hit in each field adds. Some fields are searched by Japanese words (morphological analysis), some by 2-grams. 0 leaves a field out (not all of them)."
  label_solr_search_tuning_field_title_ja: "Title (words)"
  label_solr_search_tuning_field_content_ja: "Text (words)"
  label_solr_search_tuning_field_title: "Title (2-grams)"
  label_solr_search_tuning_field_content: "Text (2-grams)"
  label_solr_search_tuning_phrase: "Bonus for words next to each other"
  text_solr_search_tuning_phrase: "With several words, the points added to documents where they stand next to each other (the Japanese fields). 0: no bonus. Not used by \"search the exact string\"."
  label_solr_search_tuning_types: "Multiplier by type"
  text_solr_search_tuning_factors: "What the score of documents of that type is multiplied by: above 1 raises them, below 1 lowers them. The multiplier of issues applies to their notes."
  label_solr_search_tuning_type_issue: "Issues (and notes)"
  label_solr_search_tuning_type_wiki_page: "Wiki pages"
  label_solr_search_tuning_type_document: "Documents"
  label_solr_search_tuning_type_attachment: "Attachments"
  label_solr_search_tuning_type_external: "External sources (all)"
  label_solr_search_tuning_sources: "Multiplier by external source"
  text_solr_search_tuning_sources: "What the score of that source's documents is multiplied by (on top of the multiplier of the type)."
  label_solr_search_tuning_recency: "Recency"
  text_solr_search_tuning_recency: "Raises the newly updated a little. \"Strength\" is the share added to a document updated just now (0: not used). \"Half life\" is the days after which that effect is half."
  label_solr_search_tuning_recency_strength: "Strength"
