  label_solr_search_admin_scheduler_started: "%{time} に起動"
  label_solr_search_admin_scheduler_never: "応答の記録がありません"
  text_solr_search_admin_scheduler_silent: "Docker では docker compose ps と docker compose logs scheduler を見てください。スケジューラーを使わず、cron などでクロールを動かす場合は、設定ページの「クロール」で処理をすべて無効にすると、この警告は出なくなります。"
