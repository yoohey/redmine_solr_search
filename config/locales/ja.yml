  text_solr_search_sources_archived: "「実際に検索に使っているプロジェクト」で、名前にリンクが付いていないものは、アーカイブ済みのプロジェクトです（Redmine の標準の動きです）。"
  text_solr_search_sources: "外部ソースは、Solr のコレクション1つ分の文書です。Solr にコレクションを作り（Redmine は作りません）、下の「まだ登録していないコレクション」から選んで、名前と説明を付けて登録します。選べるのは configset が src のコレクションだけです。ソースごとに利用を許可するプロジェクトを決め、各プロジェクトの設定の「全文検索」タブで、そのプロジェクトが検索に使うかどうかを選びます。状態の印は、管理ページを開いたときの Solr の様子で、検索の動きは変えません。"
  text_solr_search_source_description: "どこの文書か（フォルダの場所など）を書いておくと、紐付けるときに分かりやすくなります。"
  text_solr_search_source_linkable: "ここで許可したプロジェクトの管理者が、そのプロジェクトの設定の「全文検索」タブで、このソースを検索に使うかどうかを選びます。選んだプロジェクトの子プロジェクトは含みません。許可を外すと、そのプロジェクトで検索に使っていた分も外れます。"
