  text_solr_search_synonyms_intro: "検索語を、同じ意味の言い方にも広げる辞書です。旧称と新称、略語と正式名称、部署ごとの言い回しなどを書いておくと、どちらで探しても、どちらで書かれた文書も見つかります。保存するとすぐ、Redmineのデータと、すべての外部ソースの検索に効きます（インデックスの作り直しは要りません）。検索画面で「字面どおりに探す」にしたときは、広げません。"
  label_solr_search_synonyms_text: "辞書"
  text_solr_search_synonyms_format: "1行に1グループ。同じ意味の語を、「,」（全角の「，」「、」も可）で区切って書きます。「#」で始まる行と空行は読み飛ばします。語に空白を入れてもかまいません（例：シングル サインオン）。語は、検索語と全体が同じときだけ当てはまります（「PC」は「PC管理」には当てはまりません）。大文字と小文字、全角と半角は区別しません。1つのグループは8語まで、1つの語は100文字・空白で区切った4語まで、全体で2,000行・200KBまでです。"
  text_solr_search_synonyms_example: "# 旧称と新称\n在宅勤務,テレワーク,リモートワーク\n# 略語と正式名称（空白を含む語）\nSSO,シングル サインオン\n# 表記のゆれ\n規程,規定"
