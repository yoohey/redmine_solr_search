  text_solr_search_link_pattern: "「リンク」のときに使います。例：https://intranet.example/files/%path%　%url%・%path%・%title%・%id% は、文書の値（URL エンコードしたもの。/ も %2F になります）に置き換わります。%path_slash% は、場所の \\ を / にして、/ を残したまま各部分を URL エンコードしたもの（\\\\server\\share\\a.pdf は server/share/a.pdf）です。先頭は http:// か https:// で、ホスト名には置き換えを使えません。ブラウザは Web ページから file:// へのリンクを開かないので、共有フォルダの場所を出すには、Web から開ける URL に写す書式を書きます。"
  label_solr_search_link_example_pattern: "書式の例：共有フォルダの文書を、社内の閲覧システムで開く"
  text_solr_search_link_example_pattern: "「リンクの書式」に、次のように書きます。場所が \\\\server\\share\\a.pdf の文書は、https://docs.example.com/files/server/share/a.pdf のリンクになります。"
  label_solr_search_link_example_script: "スクリプトの例：結果に「Copy path」ボタンを足す"
  text_solr_search_link_example_script: "View Customize の「JavaScript」の規則（パスのパターンは /solr_search$、挿入位置は「ページの末尾」）に入れます。場所をコピーして、ファイルのエクスプローラーに貼る使い方です。左のバーやページ送りで結果が入れ替わっても動くように、読み込み時と、入れ替えのあとの solr-search:updated の両方で動かします。"
  button_solr_search_code_copy: "コピー"
  text_solr_search_link_attributes: "どちらの形式でも、検索結果の外部の文書の要素には data-solr-source・data-solr-source-name・data-solr-id・data-solr-title・data-solr-url・data-solr-path・data-solr-indexed-path（インデックスにある読み替え前の場所）が付きます。View Customize などのスクリプトで、好きなリンクに作り換えられます。値は外部の文書の作者が決めるので、信用せず、リンクにするときは http:// か https:// で始まることを確かめてください（javascript: などを href に入れないため）。"
