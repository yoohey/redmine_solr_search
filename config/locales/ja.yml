  text_solr_search_reindex: "ここは、再実行のフラグを立てるだけです。実際に動かすのはスケジューラーで、1分以内に始めます（スケジューラーを使わない環境では rake redmine:solr_search:requests）。動かせるのは同時に1つだけなので、ほかの実行中は待ちます。送り直すだけで、Redmineにもうないものは消しません（それは突き合わせの処理です）。添付ファイルは、普段は専用のクロールが足りない分を送ります。全部の本文を取り出し直すときは、下の「添付ファイルの作り直し」で行います（重いので、別の枠にしてあります）。表には、待機中・実行中のものと、終わったものの新しい3件が、状態つきで出ます（実行の記録なので、保存期間を過ぎたものは消えます）。取り消せるのは待機中のものだけです。結果の件数は、下の実行の一覧に「管理ページ」が始めたものとして出ます。"
