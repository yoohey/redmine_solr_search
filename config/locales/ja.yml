  label_solr_search_run_duration: "所要時間"
  label_solr_search_run_counts: "送った数（消した数）"
  label_solr_search_run_never: "まだ動いていません"
  label_solr_search_run_task_incremental: "差分クロール"
  label_solr_search_run_task_resend: "送り直し"
  label_solr_search_run_task_reconcile: "突き合わせ"
  label_solr_search_run_task_attachments: "添付ファイル"
  label_solr_search_run_task_reindex: "インデックスの全件の作り直し"
  label_solr_search_run_status_requested: "待機中"
  label_solr_search_run_status_running: "実行中"
  label_solr_search_run_status_succeeded: "成功"
  label_solr_search_run_status_failed: "失敗"
  label_solr_search_run_trigger_scheduler: "スケジューラー"
  label_solr_search_run_trigger_rake: "rake"
  label_solr_search_run_trigger_admin: "管理ページ"
  text_solr_search_admin_replicas: "レプリカごとに、そのレプリカだけで検索したときに見える文書の件数と、その中でいちばん新しい文書の更新日時です。すべてのレプリカで同じはずです。「遅れ」は、ほかのレプリカより古い文書までしか見えていないレプリカです（ZooKeeper 上は active でも、止まったリーダーなど）。「件数が違う」は、最新の文書は同じでも件数が違うレプリカで、どれが正しいかはここからは決められません（削除を取り込めていないレプリカは、件数が多くなります）。「応答なし」は、問い合わせに答えなかったレプリカです。投入の直後は、コミット（10秒以内）までの間、一時的に印が付くことがあります。"
  label_solr_search_admin_title: "全文検索の状態"
  text_solr_search_admin_no_solr_url: "Solr の接続先が設定されていません。管理 →「全文検索」→「状態」タブの「Solr」の欄に入れて「更新」するか、Redmine（とスケジューラー）を起動する環境に、環境変数 SOLR_URL（例：http://127.0.0.1:8983/solr）を設定して、再起動してください。"
  label_solr_search_admin_more: "詳しく"
  text_solr_search_admin_custom_fields_summary: "カスタムフィールドの設定を変えたときは、「インデックス」タブの「部分インデックスの作り直し」が要ることがあります。"
  text_solr_search_admin_replicas_summary: "すべてのレプリカで同じになるはずです。違う行には「遅れ」「件数が違う」「応答なし」の印が付きます。"
  text_solr_search_admin_last_runs_summary: "クロールの処理（rake タスク）が動いたかどうかの記録です。スケジューラーからでも、cron などから直接動かしても残ります。"
  text_solr_search_admin_scheduler_silent_summary: "スケジューラーが動いていないか、止まっています。"
  label_solr_search_admin_scheduler_unused: "スケジューラーは使わない設定です（設定ページの「クロール」で、処理がすべて無効になっています）。"
  label_solr_search_duration_seconds: "%{s}秒"
  label_solr_search_duration_minutes: "%{m}分%{s}秒"
  label_solr_search_duration_hours: "%{h}時間%{m}分"
  label_solr_search_settings_search: "検索画面"
  label_solr_search_settings_admin: "管理ページ"
  label_solr_search_schedule_before: ""
  label_solr_search_schedule_after: "ごとに動かす"
  label_solr_search_schedule_unit: "単位"
  text_solr_search_run_task_incremental: "前回から更新・作成されたチケット・注記・Wiki・文書を送ります。新しい内容が検索に出るまでの時間は、ほぼこの間隔で決まります。"
  text_solr_search_run_task_resend: "更新日時が残らない変更（文書の編集、Wikiページの名前の変更や移動）を拾うため、その種類をすべて送り直します。データが多いほど重くなります。"
  text_solr_search_run_task_attachments: "Redmine の添付ファイルのうち、まだインデックスにないものを送ります。ファイルの本文を取り出す（Tika）ので時間がかかり、差分クロールとは別にしてあります。1回に送る数と時間には上限があり、残りは次の実行が続けます。Tika に届かないときは、何もせずに「失敗」として終わります（Tika を使わない環境では、この処理を無効にしてください）。Tika は動いているのに、あるファイルだけ答えないときは、そのファイルは本文なしで入ります。圧縮ファイルと大きすぎるファイルは、本文なしで（ファイル名と説明だけで）入ります。そのほかの理由で本文を取り出せなかったファイルは、Redmine のログに1件ずつ残ります（[solr_search] の印と、添付ファイルの ID）。"
  text_solr_search_run_task_reconcile: "Redmine で消したもの（と、インデックスの対象から外れたもの）を、インデックスからも消します。それまでは、消したものも検索の件数に数えられます（画面には出しません）。"
