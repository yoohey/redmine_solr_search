  text_solr_search_log_export: "今の絞り込み（期間、0件だけ、開かれなかった検索だけ、検索語）に合う、すべての検索とクリックを、ZIP（CSV 3つと README）で落とします。画面は50件ずつですが、ダウンロードは全部です。CSV は UTF-8（BOM つき）なので、Excel でも Power Query でも読めます。3つは、検索ログ、クリック、書き出した時点のコレクションの様子（コレクションの名前、configset、種類ごとの件数、外部ソースなど）です。検索語と利用者が入っているので、取り扱いに気を付けてください。"
