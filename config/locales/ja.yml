  text_solr_search_hint_types: "「種類」のチェックを増やす"
  text_solr_search_hint_projects: "プロジェクトを「すべてのプロジェクト」にする"
  text_solr_search_hint_attributes: "「属性も含めて検索する」をオンにする（チケットのカスタムフィールドも探します）"
  error_solr_search_failed: "検索できませんでした。しばらくしてからやり直すか、管理者に連絡してください。"
  error_solr_search_no_words: "検索キーワードを入力してください。"
  error_solr_search_too_many_words: "検索キーワードが多すぎます。%{max}個までにしてください。"
  setting_solr_search_global_search_access: "全体検索の利用範囲"
  label_solr_search_global_search_access_all: "すべてのユーザー（ログインしていない人を含む）"
  label_solr_search_global_search_access_logged: "ログインユーザーのみ"
  label_solr_search_global_search_access_with_permission: "いずれかのプロジェクトで「全文検索」の権限を持つユーザーのみ（システム管理者を含む）"
  text_solr_search_global_search_access: "プロジェクトの外から使う検索（トップメニューと、プロジェクトの外のページのタブにある「全文検索」）を、誰に使わせるかを決めます。使えない人には、この2つのメニューが出ず、URL を直接開いても使えません（ログインしていない人はログイン画面になります）。\n\nプロジェクトの中のページのタブにある「全文検索」は、この設定に関係しません。そのプロジェクトで全文検索のモジュールが有効で、その人に「全文検索」の権限があれば使えます。\n\nどれを選んでも、検索結果に出るのは、その人が Redmine で見てよいものだけです。"
  setting_solr_search_max_words: "検索キーワードの数の上限"
  text_solr_search_max_words: "%{min}〜%{max}の間で入力してください（範囲の外の値は近いほうの端、数字でない値は既定値として扱います）。これより多い語で検索すると、語を減らすように表示し、Solrには問い合わせません。多くするほど、1回の検索が Solr に重くなります。"
  setting_solr_search_expand_spelling_variants: "ヴ行・バ行、ヶ・ケなどの綴りのゆれも探す"
  text_solr_search_expand_spelling_variants: "検索語を、もう一方の書き方でも探します（バイオリンとヴァイオリン、霞ケ関と霞ヶ関）。Solrの同義語の一覧で表記ゆれを扱う場合は、オフにしてください。「同義語」タブの辞書とは別の機能で、両方オンのときは組み合わさります。「字面どおりに探す」ときは、どちらも使いません。"
  setting_solr_search_show_solr_request: "管理者にSolrへの問い合わせを表示する"
  text_solr_search_show_solr_request: "結果の上に、Solrに送った問い合わせと、Solrがどう解釈したかを、管理者にだけ表示します。"
  setting_solr_search_run_retention_days: "クロールの実行の記録を残す期間"
  text_solr_search_run_retention_days: "これより古い記録は、クロールが終わるときに消します。0 にすると消しませんが、記録が増え続けるのでお勧めしません（差分クロールを10分ごとに動かすと、1日144件）。"
  label_solr_search_schedule: "クロール"
  label_solr_search_schedule_every: "間隔"
  label_solr_search_unit_minutes: "分"
  label_solr_search_unit_hours: "時間"
  label_solr_search_unit_days: "日"
  label_solr_search_schedule_none: "スケジューラーを使わない"
  text_solr_search_schedule_none: "cron などの別の仕組みで rake タスクを動かすときに入れます。下の4つの処理が、すべて無効になります（外すと、すべて有効に戻ります）。"
  text_solr_search_schedule: "スケジューラー（rake redmine:solr_search:scheduler。Docker では scheduler サービス）は、前回の開始からこの間隔が経った処理を動かします（失敗した回も数えます）。「毎時0分」のように時刻で決めたい場合や、常駐のプロセスを動かしたくない場合は、ここを無効にし、cron などから rake タスクを動かしてください。インデックスの全件の作り直しは、スケジューラーでは動かしません。"
  label_solr_search_settings_attachments: "添付ファイル"
  setting_solr_search_attachment_extensions: "本文を取り出す拡張子"
  text_solr_search_attachment_extensions: "ここに書いた拡張子のファイルだけ、Tika で本文を取り出して検索の対象にします。書いていない拡張子（拡張子のないものも）は、ファイル名と説明だけで検索できます。空白かコンマで区切ります（大文字小文字は区別せず、先頭の . はあってもなくてもかまいません）。空にすると、初期値になります。画像は、本文がないので、初期値には入れていません。"
  text_solr_search_attachment_extensions_default: "初期値：%{list}"
  text_solr_search_attachment_extensions_in_use: "いま使われる拡張子：%{list}"
  text_solr_search_attachment_extensions_ignored: "無視される書き方：%{list}（英数字と _ + - だけが使えます）"
  text_solr_search_attachment_extensions_archive_warning: "圧縮ファイル（%{list}）が入っています。圧縮ファイルは、中のファイルがすべて1つの文書につながって巨大になり、どのファイルに当たったか分からず、中に何が入っているか分からないままインデックスに入ります。Tika の時間とメモリも使います。承知のうえで使ってください。"
  setting_solr_search_attachment_max_file_mb: "本文を取り出す1ファイルの大きさの上限"
  text_solr_search_attachment_max_file_mb: "これより大きいファイルは、Tika に送らず、ファイル名と説明だけにします（%{min}〜%{max}）。"
  setting_solr_search_attachment_max_text_mb: "取り出す本文の長さの上限"
  text_solr_search_attachment_max_text_mb: "本文が、これより長いときは、ここで切ります（%{min}〜%{max}）。"
  label_solr_search_megabytes: "MB"
  text_solr_search_attachment_settings_note: "変えても、すでにインデックスにあるものは、そのままです（新しく入る添付ファイルには、すぐ使われます）。きれいにしたいときは、管理ページの「添付ファイルの作り直し」を、明示的に依頼してください。"
  text_solr_search_attachment_extensions_admin: "本文を取り出す拡張子：%{list}。ほかの拡張子は、ファイル名と説明だけです。"
  setting_solr_search_per_page: "検索結果の1ページの件数（入れ物の数）"
  text_solr_search_per_page: "%{min}〜%{max}の間で入力してください（範囲の外の値は近いほうの端、数字でない値は既定値の50として扱います）。多いほど、空のページや20件に満たないページは減りますが、画面の表示と表示前の権限の確認が、件数に比例して重くなります（Solrの時間は変わりません）。届く件数は、いつも最大%{reach}件です。外部のリランカーを使うときは、並べ直す数が1ページの数に切り上がります。"
  setting_solr_search_search_timeout: "検索画面で Solr の応答を待つ時間"
  text_solr_search_search_timeout: "これを過ぎると、「検索できませんでした」と表示します。インデックスがとても大きく、時間がかかっても検索したい場合は長くしてください。"
  setting_solr_search_admin_timeout: "管理ページで Solr の応答を待つ時間"
  text_solr_search_admin_timeout: "これを過ぎると、「Solr につながりません」と表示します。Solr が応答しなくなったときに、管理ページが開かなくならないように短くしています。"
  label_solr_search_seconds: "秒"
  label_solr_search_admin_url: "Solr"
  label_solr_search_admin_connection: "接続"
  label_solr_search_admin_connected: "つながっています（%{qtime} ms）"
  label_solr_search_admin_tika_url: "Tika"
  label_solr_search_admin_not_connected: "Solr につながりません"
  label_solr_search_admin_total: "合計"
  label_solr_search_admin_counts: "種類ごとの件数"
  label_solr_search_admin_db: "Redmine"
  label_solr_search_admin_solr: "Solr"
  label_solr_search_admin_differs: "違いあり"
  label_solr_search_admin_check: "確認"
  label_solr_search_admin_replica_behind: "遅れ"
  label_solr_search_admin_replica_count_differs: "件数が違う"
  label_solr_search_admin_replica_no_response: "応答なし"
  label_solr_search_admin_page: "管理 → 全文検索"
  text_solr_search_settings_status_html: "Solr につながるか、インデックスの件数、クロールの実行の記録は、%{link} で確かめられます。"
  text_solr_search_admin_counts: "Redmine の列は、インデックスに入るはずの件数です。次のクロールまでは違いが出ることがあります。Solr の合計は、下のレプリカの「件数」と一致するはずです。"
  text_solr_search_admin_custom_fields: "チケットのカスタムフィールドの値は、そのチケットで使えるフィールドの分だけインデックスに入ります。フィールドの「トラッカー」「プロジェクト」「形式」「検索条件に使用」を変えたとき、フィールドを削除したときは、チケットの更新日時が変わらないので、差分クロールでは反映されません。「インデックス」タブの「部分インデックスの作り直し」で、そのフィールドかトラッカーを選んで動かしてください（rake redmine:solr_search:reindex FIELDS=ID。チケットと注記の全件なら TYPES=issue,journal。添付は、定期の「送り直し」で追いつく）。「表示」「ロール」「検索対象」の変更は、すぐに効きます。"
  label_solr_search_admin_replicas: "レプリカ"
  label_solr_search_admin_replicas_error: "レプリカの一覧を読めません（CLUSTERSTATUS）"
  label_solr_search_admin_core: "コア"
  label_solr_search_admin_node: "ノード"
  label_solr_search_admin_leader: "リーダー"
  label_solr_search_admin_documents: "件数"
  label_solr_search_admin_newest: "最新の文書の更新日時"
  label_solr_search_admin_last_runs: "処理ごとの最後の実行"
  text_solr_search_admin_last_runs: "処理は同時に1つだけ動きます。失敗した場所や、終わらないまま止まっている処理など、ここで分からないことは、Redmine のログ（「[solr_search]」の行）を見てください。Docker では docker compose logs（スケジューラーは scheduler サービス。docker compose exec で動かした rake は、その出力）、それ以外では log/production.log や、cron などのジョブの出力です。"
  label_solr_search_run_finished_at: "終了"
  label_solr_search_run_next: "次の実行（目安）"
  label_solr_search_run_next_due: "まもなく（予定の時刻を過ぎています）"
  label_solr_search_run_next_disabled: "スケジューラーでは動かさない"
  label_solr_search_run_next_manual: "rake で手動で実行"
  label_solr_search_admin_scheduler: "スケジューラー"
  label_solr_search_admin_scheduler_beat: "最後の応答"
